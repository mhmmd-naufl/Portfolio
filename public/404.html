<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>404 — Lost | Muhammad Naufal Aulia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter+Tight:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f7f5f0;
        --ink: #1a1917;
        --muted: #6f6c66;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #131210;
          --ink: #ede9e1;
          --muted: #a3a099;
        }
      }
      * {
        margin: 0;
        box-sizing: border-box;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: 'Inter Tight', Helvetica, Arial, sans-serif;
        min-height: 100svh;
        display: flex;
        align-items: flex-end;
        padding: 40px 24px;
      }
      main {
        max-width: 1200px;
        width: 100%;
        margin: 0 auto;
      }
      .label {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        color: var(--muted);
      }
      h1 {
        font-size: clamp(3rem, 10vw, 8rem);
        font-weight: 500;
        letter-spacing: -0.04em;
        line-height: 0.95;
        margin-top: 24px;
      }
      p {
        color: var(--muted);
        margin-top: 16px;
        max-width: 32rem;
        line-height: 1.6;
      }
      a {
        display: inline-block;
        margin-top: 32px;
        color: var(--ink);
        font-family: 'IBM Plex Mono', monospace;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        text-underline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.svg" alt="Mark" style="height: 32px; margin-bottom: 8px;" />
      <p class="label">404 / Not found</p>
      <h1>Lost.</h1>
      <p>This page doesn&rsquo;t exist. The portfolio lives one level up.</p>
      <a href="/">Back home &uarr;</a>
    </main>
  </body>
</html>
